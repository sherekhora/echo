<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- PLEASE NO CHANGES BELOW THIS LINE (UNTIL I SAY SO) -->
  <script language="javascript" type="text/javascript" src="libraries/p5.min.js"></script>
  <script src="https://unpkg.com/p5@1.5.0/lib/addons/p5.sound.min.js"></script>
  <script language="javascript" type="text/javascript" src="sketch_261013a.js"></script>
  <!-- OK, YOU CAN MAKE CHANGES BELOW THIS LINE AGAIN -->
  <script src="shape.js"></script>
  <script src="audio.js"></script>
  <script src="cover.js"></script>
  <script src="record.js"></script>
  <script src="ui.js"></script>

  <style>
    :root {
      --bg:     #d6d6d3;
      --panel:  #ebebe8;
      --sunken: #c4c4c0;
      --line:   #b4b4af;
      --ink:    #1c1c1a;
      --dim:    #86867f;
      --accent: #ff5c00;
      --bar-h:  48px;
      --work-h: calc(100vh - var(--bar-h) - 48px);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 11px/1.3 "SF Mono", "Roboto Mono", Menlo, monospace;
      -webkit-font-smoothing: antialiased; user-select: none;
    }

    /* ---- верхня панель: ліво / центр / право ---- */

    #topbar {
      height: var(--bar-h);
      margin: 18px 18px 0;
      padding: 0 14px;
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    }
    #tbLeft, #tbCenter, #tbRight { display: flex; align-items: center; gap: 14px; }
    #tbLeft   { justify-self: start; }
    #tbCenter { justify-self: center; }
    #tbRight  { justify-self: end; }

    #topbar .lbl {
      width: auto; font-size: 9px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim);
    }
    #topbar .seg { flex: none; width: 110px; }
    #topbar .seg button { padding: 6px 0; }
    #topbar .tgl, #topbar .act { flex: none; padding: 7px 16px; }

    #topbar .sizeseg { display: flex; }
    #topbar .sizeseg .seg { width: 230px; }
    #topbar input.num { width: 62px; padding: 5px 6px; }

    .chk { display: flex; align-items: center; }
    .chk label {
      display: flex; align-items: center; gap: 7px; cursor: pointer;
      font-size: 9px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink);
    }
    .chk input {
      -webkit-appearance: none; appearance: none; margin: 0; cursor: pointer; flex: none;
      width: 14px; height: 14px; border: 1.5px solid var(--ink); border-radius: 2px;
      background: var(--panel); position: relative;
    }
    .chk input:checked { background: var(--ink); }
    .chk input:checked::after {
      content: ''; position: absolute; left: 3px; top: 0px;
      width: 4px; height: 8px; border: solid #fff; border-width: 0 1.5px 1.5px 0;
      transform: rotate(45deg);
    }

    /* ---- робоча зона ---- */

    #app { display: flex; gap: 18px; padding: 12px 18px 18px; align-items: flex-start; }

    .col {
      width: 290px; flex: none; display: flex; flex-direction: column; gap: 12px;
      max-height: var(--work-h); overflow-y: auto;
    }

    .panel {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 5px; padding: 14px;
    }
    #textPanel { width: 290px; flex: none; max-height: var(--work-h); overflow-y: auto; }

    .brand {
      display: flex; justify-content: space-between; align-items: baseline;
      padding-bottom: 11px; margin-bottom: 13px; border-bottom: 1px solid var(--line);
    }
    .brand b { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; }
    .brand span { color: var(--dim); letter-spacing: .1em; }

    summary.brand { list-style: none; cursor: pointer; }
    summary.brand::-webkit-details-marker { display: none; }
    summary.brand b::before {
      content: '+'; display: inline-block; width: 16px; color: var(--accent);
    }
    details[open] > summary.brand b::before { content: '−'; }
    details:not([open]) > summary.brand { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }

    details.sub { margin-bottom: 10px; }
    details.sub > summary {
      display: block; list-style: none; cursor: pointer;
      padding-bottom: 5px; margin-bottom: 8px; border-bottom: 1px dotted var(--line);
      font-size: 9px; font-weight: 700; letter-spacing: .18em;
      text-transform: uppercase; color: var(--dim);
    }
    details.sub > summary::-webkit-details-marker { display: none; }
    details.sub > summary::before {
      content: '+'; display: inline-block; width: 14px; color: var(--accent);
    }
    details.sub[open] > summary::before { content: '−'; }
    details.sub > summary::after { content: attr(data-n); float: right; color: var(--line); }
    details.sub:not([open]) > summary { margin-bottom: 0; }

    .grp { margin-bottom: 14px; transition: opacity .15s; }
    .grp > h4 {
      display: flex; justify-content: space-between; margin: 0 0 8px; padding-bottom: 5px;
      border-bottom: 1px dotted var(--line); font-size: 9px; font-weight: 700;
      letter-spacing: .18em; text-transform: uppercase; color: var(--dim);
    }
    .grp > h4::after { content: attr(data-n); color: var(--line); }

    .row { display: flex; align-items: center; gap: 9px; min-height: 24px; margin-bottom: 3px; }
    .row .lbl {
      width: 66px; flex: none; font-size: 9px; letter-spacing: .06em;
      text-transform: uppercase; color: var(--dim);
    }
    .row .val { width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
    .clock { color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .note { color: var(--dim); font-size: 9px; letter-spacing: .04em; }

    .meter { flex: 1; height: 6px; background: var(--sunken); border-radius: 1px; overflow: hidden; }
    .meter i { display: block; height: 100%; width: 0; background: var(--accent); }

    .seg { display: flex; flex: 1; gap: 4px; }
    .seg button, .tgl, .act {
      flex: 1; font: inherit; letter-spacing: .12em; text-transform: uppercase;
      padding: 7px 0; cursor: pointer; border-radius: 3px;
      border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    }
    .seg button.on, .tgl.on { background: var(--ink); border-color: var(--ink); color: #fff; }
    .tgl.rec.on { background: var(--accent); border-color: var(--accent); }
    .act { background: var(--accent); border-color: var(--accent); color: #fff; }
    .act:active { transform: translateY(1px); }

    textarea, input[type=number], input.hex {
      font: inherit; color: var(--ink); background: #fff;
      border: 1px solid var(--line); border-radius: 3px; user-select: text;
    }
    textarea:focus, input:focus { outline: none; border-color: var(--accent); }
    textarea {
      display: block; width: 100%; height: 92px; resize: vertical;
      padding: 7px; margin-bottom: 6px; line-height: 1.45;
    }
    input[type=number] { width: 70px; padding: 4px 6px; }
    input.num { width: 52px; text-align: right; }
    input.hex { width: 84px; padding: 4px 6px; text-transform: uppercase; }

    input[type=file] { flex: 1; min-width: 0; font: inherit; font-size: 9px; color: var(--dim); }
    input[type=file]::file-selector-button {
      font: inherit; font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
      padding: 6px 10px; margin-right: 8px; cursor: pointer; border-radius: 3px;
      border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    }

    input[type=range] {
      flex: 1; -webkit-appearance: none; appearance: none;
      height: 20px; background: transparent; margin: 0; cursor: pointer;
    }
    input[type=range]::-webkit-slider-runnable-track { height: 3px; background: var(--sunken); }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 5px; height: 15px; margin-top: -6px;
      border-radius: 1px; background: var(--ink);
    }
    input[type=range]:hover::-webkit-slider-thumb { background: var(--accent); }
    input[type=range]::-moz-range-track { height: 3px; background: var(--sunken); }
    input[type=range]::-moz-range-thumb {
      width: 5px; height: 15px; border: none; border-radius: 1px; background: var(--ink);
    }

    #stage {
      flex: 1 1 auto; min-width: 0; height: var(--work-h);
      display: flex; justify-content: center; align-items: flex-start;
      line-height: 0;
    }
    #stage canvas {
      width: auto !important; height: auto !important;
      max-width: 100%; max-height: var(--work-h);
    }
  </style>
</head>
<body>
  <div id="topbar" class="panel">
    <div id="tbLeft"></div>
    <div id="tbCenter"></div>
    <div id="tbRight"></div>
  </div>

  <div id="app">
    <div class="col">
      <details class="panel">
        <summary class="brand"><b>sound</b><span>01</span></summary>
        <div id="audio"></div>
      </details>
      <details class="panel">
        <summary class="brand"><b>cover</b><span>02</span></summary>
        <div id="cover"></div>
      </details>
    </div>

    <div id="stage"></div>

    <div class="panel" id="textPanel">
      <div class="brand"><b>text</b><span>03</span></div>
      <div id="controls"></div>
    </div>
  </div>
</body>
</html>
