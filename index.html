<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- PLEASE NO CHANGES BELOW THIS LINE (UNTIL I SAY SO) -->
  <script language="javascript" type="text/javascript" src="libraries/p5.min.js"></script>
  <script language="javascript" type="text/javascript" src="audio.js"></script>
  <script language="javascript" type="text/javascript" src="boards.js"></script>
  <script language="javascript" type="text/javascript" src="cover.js"></script>
  <script language="javascript" type="text/javascript" src="font.js"></script>
  <script language="javascript" type="text/javascript" src="record.js"></script>
  <script language="javascript" type="text/javascript" src="shape.js"></script>
  <script language="javascript" type="text/javascript" src="ui.js"></script>
  <script language="javascript" type="text/javascript" src="sketch_261013a.js"></script>
  <!-- OK, YOU CAN MAKE CHANGES BELOW THIS LINE AGAIN -->

  <!-- Блок вище Processing перегенеровує сам: вписує всі .js вкладки і прибирає
       рядки, яких не знає. Тому вкладки стоять там, а p5.sound — тут, і
       підключається, лише якщо його ще немає. Порядок вкладок неважливий:
       код у них виконується в preload/setup, після завантаження сторінки. -->
  <script>
    if (typeof p5.FFT !== 'function') {
      document.write('<script src="https://unpkg.com/p5@1.5.0/lib/addons/p5.sound.min.js"><\/script>');
    }
  </script>

  <style>
    :root {
      --page:   #ececea;                 /* фон сторінки */
      --edge:   1svw;                    /* відступ інтерфейсу від країв вікна */
      --pill:   #ffffff;                 /* пігулки з повзунками, поля вводу */
      --chip:   #dcdcd9;                 /* кнопки і перемикачі */
      --chip-h: #cfcfcb;                 /* кнопка під курсором */
      --ink:    #111111;
      --dim:    #8a8a85;
      --accent: #f04a2a;                 /* активний стан; текст на ньому темний */
      --h:      36px;                    /* висота всіх контролів */
      --r:      999px;                   /* радіус пігулки */
    }
    * { box-sizing: border-box; }

    /* висота береться від контейнера (вікна або iframe), а не від 100vh:
       html → body → #app → колонки і полотно, усе через відсотки */
    html, body { height: 100%; }
    body {
      margin: 0; overflow: hidden;
      display: flex; flex-direction: column;
      background: var(--page); color: var(--ink);
      font: 13px/1.25 "Helvetica Neue", Helvetica, Inter, system-ui, -apple-system, Arial, sans-serif;
      -webkit-font-smoothing: antialiased; user-select: none;
    }

    /* панелі без фону: контроли лежать прямо на сторінці */
    .panel { background: none; border: 0; padding: 0; }

    /* ---- верхня панель: ліво / центр / право ---- */

    #topbar {
      flex: none;
      min-height: var(--h);
      margin: var(--edge) var(--edge) 0;
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
    }
    #tbLeft, #tbCenter, #tbRight { display: flex; align-items: center; gap: 8px; }
    #tbLeft   { justify-self: start; }
    #tbCenter { justify-self: center; }
    #tbRight  { justify-self: end; }

    #topbar .lbl { color: var(--dim); margin: 0 2px 0 6px; }
    #topbar .lbl:first-child { margin-left: 2px; }
    #topbar .seg, #topbar .sizeseg { flex: none; }
    #topbar .seg button, #topbar .tgl, #topbar .act { flex: none; }
    #topbar input.num { width: 72px; text-align: center; }

    /* ---- робоча зона ---- */

    /* #app забирає весь залишок висоти під верхньою панеллю */
    #app {
      flex: 1 1 0; min-height: 0;
      display: flex; gap: 20px; padding: 20px var(--edge) var(--edge); align-items: flex-start;
    }

    .col {
      width: 300px; flex: none; display: flex; flex-direction: column; gap: 14px;
      max-height: 100%; overflow-y: auto;
    }
    #textPanel { width: 300px; flex: none; max-height: 100%; overflow-y: auto; }

    /* заголовок панелі: назва ліворуч, стрілка праворуч */
    .brand {
      display: flex; justify-content: space-between; align-items: center;
      min-height: 28px; padding: 0 4px; margin-bottom: 8px;
      font-size: 15px;
    }
    .brand b { font-weight: 600; }
    .brand span { display: none; }

    summary.brand { list-style: none; cursor: pointer; }
    summary.brand::-webkit-details-marker { display: none; }
    summary.brand::after { content: '↓'; }
    details[open] > summary.brand::after { content: '↑'; }
    details:not([open]) > summary.brand { margin-bottom: 0; }

    /* згорнута підгрупа — сірий чип зі стрілкою */
    details.sub { margin-bottom: 8px; }
    details.sub > summary {
      display: inline-flex; align-items: center; gap: 10px;
      height: var(--h); padding: 0 18px; margin-bottom: 8px;
      list-style: none; cursor: pointer;
      border-radius: var(--r); background: var(--chip);
    }
    details.sub > summary:hover { background: var(--chip-h); }
    details.sub > summary::-webkit-details-marker { display: none; }
    details.sub > summary::after { content: '↓'; }
    details.sub[open] > summary::after { content: '↑'; }
    details.sub:not([open]) > summary { margin-bottom: 0; }

    .grp { margin-bottom: 18px; transition: opacity .15s; }
    .grp > h4 { margin: 0 0 8px; padding: 0 18px; font-size: 13px; font-weight: 600; }

    /* усі внутрішні тексти починаються на 18px від краю колонки,
       контроли — на 94px (18 + підпис 68 + проміжок 8) */
    .row {
      display: flex; align-items: center; gap: 8px; min-height: var(--h); margin-bottom: 6px;
      padding-left: 18px;
    }
    .row .lbl { width: 68px; flex: none; color: var(--dim); }
    .row .lbl:empty { display: none; }
    .row .val { width: 40px; text-align: right; font-variant-numeric: tabular-nums; }

    /* рядок «підпис — повзунок — значення» в білій пігулці */
    .row.pill {
      background: var(--pill); border-radius: var(--r);
      padding: 0 16px 0 18px; gap: 8px;
    }
    .row.pill .lbl { width: 68px; color: var(--ink); font-weight: 600; }
    .row.pill input.num {
      width: 44px; height: auto; padding: 0;
      background: transparent; text-align: right;
    }
    .row.pill:has(input.num:focus) { box-shadow: 0 0 0 1.5px var(--accent); }

    .clock { color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .note { color: var(--dim); font-size: 11px; padding: 0 18px; margin: 2px 0 8px; }

    /* рівень смуги під пігулкою shift */
    .row:has(.meter) { min-height: 0; padding: 0 18px; margin: 0 0 10px; }
    .meter { flex: 1; height: 3px; background: var(--chip); border-radius: 2px; overflow: hidden; }
    .meter i { display: block; height: 100%; width: 0; background: var(--accent); }

    /* ---- кнопки ---- */

    .seg { display: flex; flex: 1; gap: 6px; }
    .seg button, .tgl, .act {
      flex: 1; font: inherit; height: var(--h); padding: 0 16px;
      cursor: pointer; white-space: nowrap;
      border: 0; border-radius: var(--r);
      background: var(--chip); color: var(--ink);
      transition: background .12s;
    }
    .seg button:hover, .tgl:hover { background: var(--chip-h); }
    .seg button.on, .tgl.on, .tgl.rec.on { background: var(--accent); color: var(--ink); }
    .act { background: var(--ink); color: #fff; }
    .act:hover { background: #333; }
    .act:active, .tgl:active, .seg button:active { transform: translateY(1px); }
    .tgl:disabled { opacity: .35; cursor: default; }
    button:focus { outline: none; }

    /* текстова кнопка (repeat, space ln): як підпис у пігулці, вимкнена — закреслена */
    .flag {
      font: inherit; font-weight: 600; color: var(--ink);
      height: var(--h); padding: 0; margin-right: 18px;
      background: none; border: 0; cursor: pointer;
    }
    .flag:not(.on) { text-decoration: line-through; }
    .flag:disabled { opacity: .35; cursor: default; }
    .tgl:disabled:hover { background: var(--chip); }

    /* ---- поля ---- */

    textarea, input[type=number], input.hex {
      font: inherit; color: var(--ink); background: var(--pill);
      border: 0; border-radius: var(--r); user-select: text;
    }
    textarea:focus, input:focus { outline: none; }
    input[type=number]:focus { box-shadow: 0 0 0 1.5px var(--accent); }
    .row.pill input.num:focus { box-shadow: none; }
    textarea {
      display: block; width: 100%; height: 96px; resize: vertical;
      padding: 12px 18px; margin-bottom: 6px; line-height: 1.4;
      border-radius: 18px;
    }
    textarea:focus { box-shadow: inset 0 0 0 1.5px var(--accent); }
    input[type=number] {
      width: 80px; height: var(--h); padding: 0 14px;
      font-variant-numeric: tabular-nums; -moz-appearance: textfield;
    }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input.hex { width: 90px; height: var(--h); padding: 0 14px; text-transform: uppercase; }

    input[type=file] { flex: 1; min-width: 0; font: inherit; font-size: 11px; color: var(--dim); }
    input[type=file]::file-selector-button {
      font: inherit; font-size: 13px; color: var(--ink);
      height: var(--h); padding: 0 16px; margin-right: 10px; cursor: pointer;
      border: 0; border-radius: var(--r); background: var(--chip);
    }
    input[type=file]::file-selector-button:hover { background: var(--chip-h); }

    /* повзунок: тонка чорна лінія, порожнє коло */
    input[type=range] {
      flex: 1; min-width: 0; -webkit-appearance: none; appearance: none;
      height: var(--h); background: transparent; margin: 0; cursor: pointer;
    }
    input[type=range]::-webkit-slider-runnable-track { height: 1.5px; background: var(--ink); }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; box-sizing: border-box;
      width: 14px; height: 14px; margin-top: -6.25px;
      border-radius: 50%; border: 1.5px solid var(--ink); background: var(--pill);
    }
    input[type=range]:hover::-webkit-slider-thumb { border-color: var(--accent); }
    input[type=range]::-moz-range-track { height: 1.5px; background: var(--ink); }
    input[type=range]::-moz-range-thumb {
      box-sizing: border-box; width: 14px; height: 14px;
      border-radius: 50%; border: 1.5px solid var(--ink); background: var(--pill);
    }

    /* ---- полотна: сусід ‹ current › сусід, під ними навігація серії ---- */

    #stage {
      flex: 1 1 auto; min-width: 0; height: 100%;
      display: flex; flex-direction: column; gap: 14px;
    }
    #strip {
      --thumb-w: 12%;
      flex: 1 1 0; min-height: 0;
      display: flex; justify-content: center; align-items: center; gap: 16px;
      line-height: 0;
    }
    #strip > canvas {
      order: 1; flex: none;
      width: auto !important; height: auto !important;
      max-height: 100%; max-width: calc(100% - 2 * var(--thumb-w) - 32px);
    }
    .thumb {
      flex: 0 0 var(--thumb-w); cursor: pointer;
      opacity: .45; transition: opacity .15s;
    }
    .thumb:hover { opacity: .8; }
    .thumb.off { visibility: hidden; }
    .thumb canvas { display: block; width: 100%; height: auto; }

    #thPrev { order: 0; }
    #thNext { order: 2; }

    #boardNav {
      flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    }
    #bnCenter, #bnRight { display: flex; align-items: center; gap: 6px; }
    #bnCenter { grid-column: 2; }
    #bnRight  { grid-column: 3; justify-self: end; }
    #boardNav .tgl { flex: none; }
    #bnCenter .tgl { width: 44px; padding: 0; font-size: 16px; }
    .bcount {
      min-width: 76px; text-align: center; font-size: 14px;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div id="topbar" class="panel">
    <div id="tbLeft"></div>
    <div id="tbCenter"></div>
    <div id="tbRight"></div>
  </div>

  <div id="app">
    <div class="col">
      <details class="panel">
        <summary class="brand"><b>sound</b><span>01</span></summary>
        <div id="audio"></div>
      </details>
      <details class="panel">
        <summary class="brand"><b>cover</b><span>02</span></summary>
        <div id="cover"></div>
      </details>
    </div>

    <div id="stage">
      <div id="strip">
        <div class="thumb off" id="thPrev"><canvas></canvas></div>
        <div class="thumb off" id="thNext"><canvas></canvas></div>
      </div>
      <div id="boardNav">
        <div id="bnCenter"></div>
        <div id="bnRight"></div>
      </div>
    </div>

    <div class="panel" id="textPanel">
      <div class="brand"><b>text</b><span>03</span></div>
      <div id="controls"></div>
    </div>
  </div>
</body>
</html>
